<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Hikayemiz ❤️</title>
    <style>
        /* CSS SIFIRLAMA VE TEMEL AYARLAR */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #4a4a4a;
        }

        /* ANA KART TASARIMI */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: fadeIn 1.2s ease-in-out;
        }

        /* HAREKETLİ KALP ANİMASYONU */
        .heart {
            font-size: 50px;
            color: #e63946;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        h1 {
            color: #d62828;
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #7d7d7d;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* FOTOĞRAF ÇERÇEVESİ */
        .photo-frame {
            width: 100%;
            height: 280px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 4px solid #ffffff;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-frame:hover img {
            transform: scale(1.05);
        }

        /* YAZI ALANI */
        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #555;
            margin-bottom: 25px;
        }

        /* MÜZİK/BUTON STİLİ */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }

        /* ANİMASYON TANIMLARI (KEYFRAMES) */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>İyi Ki Varsın!</h1>
        <div class="subtitle">Bizim Hikayemiz</div>

        <div class="photo-frame">
            <!-- Fotoğraf dosyanın adını buraya yaz -->
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=800" alt="Bizim Fotoğrafımız">
        </div>

        <p>
            Seninle geçen her gün hayatıma renk katıyor. Birlikte biriktirdiğimiz tüm anılar için çok şanslıyım. Seni çok seviyorum!
        </p>

        <!-- İsterseniz Spotify şarkı bağlantısı veya özel bir link koyabilirsiniz -->
        <a href="#" class="btn">Bizim Şarkımız 🎵</a>
    </div>

</body>
</html>
